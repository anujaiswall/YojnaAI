name: Python back end tests

on:
  push:
    paths: ["python-backend/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python-backend/**", ".github/workflows/python-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
